<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Vote - Developer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/developer.css">
</head>

<body>

    <div class="dev-container">
        <h1>Development Team</h1>
        <p class="subtitle">
            Meet the developers behind the Student Council Election 2026 system.
        </p>
        
        <div class="dev-grid" id="developerGrid">
            <p>Loading developer information...</p>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="../index.html" style="text-decoration: none;">
                <button style="width: 250px;">← Back to Home</button>
            </a>
            <div class="footer" style="margin-top: 25px;">
                <span class="footer-icon">●</span>
                Student Council Election System &copy; 2026
            </div>
        </div>
    </div>

    <script>
        // Load developers from database
        window.addEventListener('load', function() {
            fetch('../api/get_data.php?endpoint=developers')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const grid = document.getElementById('developerGrid');
                        grid.innerHTML = '';
                        
                        const avatars = ['👨‍💻', '👩‍🎨', '🧑‍💻', '👩‍💻', '👨‍🔧', '👨‍🔬', '👩‍⚖️'];
                        
                        data.data.forEach((dev, index) => {
                            const card = document.createElement('div');
                            card.className = 'dev-card';
                            card.innerHTML = `
                                <div class="dev-info">
                                    <div class="dev-avatar">${avatars[index % avatars.length]}</div>
                                    <h2 class="dev-name">${dev.name}</h2>
                                    <p class="dev-role">${dev.role || 'Developer'}</p>
                                </div>
                                <div class="dev-details">
                                    <div class="dev-item">
                                        <span class="dev-label">Year</span>
                                        <span class="dev-value">${dev.year ? dev.year + (dev.year === 1 ? 'st' : dev.year === 2 ? 'nd' : dev.year === 3 ? 'rd' : 'th') + ' Year' : 'N/A'}</span>
                                    </div>
                                    <div class="dev-item">
                                        <span class="dev-label">Department</span>
                                        <span class="dev-value">${dev.department || 'N/A'}</span>
                                    </div>
                                </div>
                            `;
                            grid.appendChild(card);
                        });
                    } else {
                        document.getElementById('developerGrid').innerHTML = '<p style="color: red;">Failed to load developer information</p>';
                    }
                })
                .catch(error => {
                    console.error('Error loading developers:', error);
                    document.getElementById('developerGrid').innerHTML = '<p style="color: red;">Error loading developer information</p>';
                });
        });
    </script>

</body>

</html>
