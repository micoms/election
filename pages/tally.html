<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Vote - Election Tally</title>
    <link rel="stylesheet" href="../css/dash.css">
    <link rel="stylesheet" href="../css/tally.css">
</head>

<body>
    <div class="page">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">🗳️</div>
                <div>
                    <h2>Student Vote</h2>
                    <p>Fall Election 2026</p>
                </div>
            </div>

            <div class="menu" id="sidebarMenu">
                <a href="dashboard.html" class="link">Dashboard</a>
                <p class="menu-label">BALLOT SECTIONS</p>
                <!-- Position links loaded dynamically -->
            </div>

            <div class="user-info">
                <div class="user-icon">👤</div>
                <div>
                    <h3 id="userName"></h3>
                    <p id="userStudentId"></p>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="step-bar">📊 Live Election Tally</div>

            <div class="content">
                <h1>Election Results</h1>
                <p class="subtitle">
                    Live vote count for all positions in the Student Council Election 2026.
                </p>

                <div id="tallyContainer">
                    <p>Loading election results...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPositions = [];

        const POSITION_EMOJIS = {
            'President': '👑',
            'Vice President': '🤝',
            'Secretary': '📋',
            'Treasurer': '💰',
            'Auditor': '🔍',
            'PIO': '📢',
            'Business Manager': '💼'
        };

        function getEmoji(posName) {
            return POSITION_EMOJIS[posName] || '📌';
        }

        window.onload = function() {
            const userName = localStorage.getItem('full_name');
            const studentId = localStorage.getItem('student_id');

            document.getElementById('userName').textContent = userName;
            document.getElementById('userStudentId').textContent = 'Student ID: ' + studentId;

            // Load positions from database first
            loadPositionsFromDatabase();
        };

        function loadPositionsFromDatabase() {
            fetch('../api/get_data.php?endpoint=positions')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.data.length > 0) {
                        allPositions = data.data;
                        buildSidebar();
                        loadAllTallies();
                        // Refresh tally every 5 seconds
                        setInterval(loadAllTallies, 5000);
                    } else {
                        document.getElementById('tallyContainer').innerHTML =
                            '<p style="color: red;">No positions found. Please contact admin.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error loading positions:', error);
                    document.getElementById('tallyContainer').innerHTML =
                        '<p style="color: red;">Error loading positions.</p>';
                });
        }

        function buildSidebar() {
            const menu = document.getElementById('sidebarMenu');
            menu.innerHTML = '<a href="dashboard.html" class="link">Dashboard</a>' +
                '<p class="menu-label">BALLOT SECTIONS</p>';

            allPositions.forEach(pos => {
                const a = document.createElement('a');
                a.href = 'vote.html?position=' + encodeURIComponent(pos.name);
                a.className = 'link';
                a.textContent = pos.name;
                menu.appendChild(a);
            });

            const reviewLink = document.createElement('a');
            reviewLink.href = 'review.html';
            reviewLink.className = 'link';
            reviewLink.textContent = 'Review & Submit';
            menu.appendChild(reviewLink);

            const tallyLink = document.createElement('a');
            tallyLink.href = 'tally.html';
            tallyLink.className = 'link last';
            tallyLink.textContent = '📊 Tally';
            menu.appendChild(tallyLink);

            const logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.className = 'link';
            logoutLink.style.cssText = 'color:#cc4444; margin-top:auto;';
            logoutLink.textContent = '🚪 Logout';
            logoutLink.onclick = logout;
            menu.appendChild(logoutLink);
        }

        function loadAllTallies() {
            const container = document.getElementById('tallyContainer');
            container.innerHTML = '';

            allPositions.forEach(pos => {
                loadTallyForPosition(pos);
            });
        }

        function loadTallyForPosition(posObj) {
            fetch('../api/get_vote_tally.php?position=' + encodeURIComponent(posObj.name))
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.results.length > 0) {
                        renderTallySection(posObj, data.results, data.total_votes);
                    } else {
                        renderEmptyTallySection(posObj);
                    }
                })
                .catch(error => {
                    console.error('Error loading tally for ' + posObj.name + ':', error);
                    renderEmptyTallySection(posObj);
                });
        }

        function renderTallySection(posObj, results, totalVotes) {
            const container = document.getElementById('tallyContainer');

            const section = document.createElement('div');
            section.className = 'tally-section';
            section.id = 'tally-' + posObj.name;

            const title = document.createElement('h2');
            title.className = 'tally-title';
            title.textContent = getEmoji(posObj.name) + ' ' + posObj.name;
            section.appendChild(title);

            results.forEach(candidate => {
                const percentage = totalVotes > 0 ? (candidate.vote_count / totalVotes) * 100 : 0;

                const row = document.createElement('div');
                row.className = 'tally-row';

                const name = document.createElement('span');
                name.className = 'tally-name';
                name.textContent = candidate.name;
                row.appendChild(name);

                const barBg = document.createElement('div');
                barBg.className = 'tally-bar-bg';

                const barFill = document.createElement('div');
                barFill.className = 'tally-bar-fill';
                barFill.style.width = percentage + '%';
                barBg.appendChild(barFill);
                row.appendChild(barBg);

                const count = document.createElement('span');
                count.className = 'tally-count';
                count.textContent = candidate.vote_count + ' vote' + (candidate.vote_count !== 1 ? 's' : '');
                row.appendChild(count);

                section.appendChild(row);
            });

            // Check if section already exists and update it, or add new section
            const existingSection = document.getElementById('tally-' + posObj.name);
            if (existingSection) {
                existingSection.innerHTML = section.innerHTML;
            } else {
                container.appendChild(section);
            }
        }

        function loadBranding() {
            fetch('../api/get_settings.php')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) return;
                    const s = data.data;
                    const nameEl = document.querySelector('.logo h2');
                    const yearEl = document.querySelector('.logo p');
                    if (nameEl) nameEl.textContent = s.org_name       || 'Student Vote';
                    if (yearEl) yearEl.textContent = s.election_title || 'Election 2026';
                });
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }

        function renderEmptyTallySection(posObj) {
            const container = document.getElementById('tallyContainer');

            const section = document.createElement('div');
            section.className = 'tally-section';
            section.id = 'tally-' + posObj.name;

            const title = document.createElement('h2');
            title.className = 'tally-title';
            title.textContent = getEmoji(posObj.name) + ' ' + posObj.name;
            section.appendChild(title);

            const message = document.createElement('p');
            message.style.color = '#999';
            message.textContent = 'No votes yet for this position';
            section.appendChild(message);

            const existingSection = document.getElementById('tally-' + posObj.name);
            if (existingSection) {
                existingSection.innerHTML = section.innerHTML;
            } else {
                container.appendChild(section);
            }
        }
    </script>
</body>

</html>
