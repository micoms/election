<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Council Election 2026</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="card">
        <div class="top-icon">📝</div>

        <h1>Sign Up</h1>
        <p class="subtitle">
            Create your account to participate in the
            Student Council Election 2026.
        </p>

        <label>Full Name</label>
        <div class="input-box">
            <input type="text" placeholder="e.g. Juan Dela Cruz">
        </div>

        <label>Email</label>
        <div class="input-box">
            <input type="email" placeholder="e.g. juan@university.edu">
        </div>

        <label>Student ID</label>
        <div class="input-box">
            <input type="text" placeholder="e.g. 20248891">
        </div>

        <label>Department</label>
        <div class="input-box">
            <select>
                <option value="">-- Select Department --</option>
                <option value="ccs">College of Computer Studies</option>
                <option value="coe">College of Engineering</option>
                <option value="cba">College of Business Administration</option>
                <option value="cas">College of Arts and Sciences</option>
                <option value="ced">College of Education</option>
                <option value="con">College of Nursing</option>
            </select>
        </div>

        <label>Year</label>
        <div class="input-box">
            <select>
                <option value="">-- Select Year --</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>

        <label>Password</label>
        <div class="input-box">
            <input type="password" placeholder="••••••••••">
        </div>

        <a href="dashboard.html"><button>Sign Up →</button></a>

        <p class="help">Already have an account? <a href="../index.html">Log In</a></p>
        <p class="help">Need help with registration? <a href="contact-admin.html">Contact Admin</a></p>

        <div class="footer">
            <span class="footer-icon">●</span>
            Official University Portal &copy; 2026
        </div>
        <a href="developer.html" class="dev-link">Developer</a>
    </div>

</body>

</html>
