<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Student Vote - Dashboard</title>
        <link rel="stylesheet" href="../css/dash.css" />
    </head>

    <body>
        <div class="page">
            <div class="sidebar">
                <div class="logo">
                    <div class="logo-icon">🗳️</div>
                    <div>
                        <h2>Student Vote</h2>
                        <p>Fall Election 2026</p>
                    </div>
                </div>

                <div class="menu" id="sidebarMenu">
                    <a href="dashboard.html" class="link current">Dashboard</a>
                    <p class="menu-label">BALLOT SECTIONS</p>
                    <!-- Position links loaded dynamically -->
                </div>

                <div class="user-info">
                    <div class="user-icon">👤</div>
                    <div>
                        <h3 id="userName"></h3>
                        <p id="userStudentId"></p>
                    </div>
                </div>
            </div>

            <div class="main">
                <div class="step-bar" id="welcomeBar"></div>

                <div class="content">
                    <h1>Dashboard</h1>
                    <p class="subtitle">
                        Welcome to the Student Council Election 2026. Click on
                        any position below to start or continue voting.
                    </p>

                    <div class="cards" id="positionCards">
                        <p>Loading positions...</p>
                    </div>

                    <div class="notice" id="noticeText">
                        Loading...
                    </div>
                </div>
            </div>
        </div>

        <script>
            let allPositions = [];

            const POSITION_EMOJIS = {
                'President': '👑',
                'Vice President': '🤝',
                'Secretary': '📋',
                'Treasurer': '💰',
                'Auditor': '🔍',
                'PIO': '📢',
                'Business Manager': '💼'
            };

            function getEmoji(posName) {
                return POSITION_EMOJIS[posName] || '📌';
            }

            window.onload = function() {
                const userName = localStorage.getItem('full_name');
                const studentId = localStorage.getItem('student_id');

                document.getElementById('welcomeBar').textContent = 'Welcome ' + userName + '!';
                document.getElementById('userName').textContent = userName;
                document.getElementById('userStudentId').textContent = 'Student ID: ' + studentId;

                // Load positions from database
                loadPositions();
                loadBranding();
            };

            function loadPositions() {
                fetch('../api/get_data.php?endpoint=positions')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success && data.data.length > 0) {
                            allPositions = data.data;
                            buildSidebar();
                            buildDashboardCards();
                            updateNotice();
                        } else {
                            document.getElementById('positionCards').innerHTML =
                                '<p style="color: red;">No positions found. Please contact admin.</p>';
                        }
                    })
                    .catch(error => {
                        console.error('Error loading positions:', error);
                        document.getElementById('positionCards').innerHTML =
                            '<p style="color: red;">Error loading positions.</p>';
                    });
            }

            function buildSidebar() {
                const menu = document.getElementById('sidebarMenu');
                menu.innerHTML = '<a href="dashboard.html" class="link current">Dashboard</a>' +
                    '<p class="menu-label">BALLOT SECTIONS</p>';

                allPositions.forEach(pos => {
                    const a = document.createElement('a');
                    a.href = 'vote.html?position=' + encodeURIComponent(pos.name);
                    a.className = 'link';
                    a.textContent = pos.name;
                    menu.appendChild(a);
                });

                const reviewLink = document.createElement('a');
                reviewLink.href = 'review.html';
                reviewLink.className = 'link';
                reviewLink.textContent = 'Review & Submit';
                menu.appendChild(reviewLink);

                const tallyLink = document.createElement('a');
                tallyLink.href = 'tally.html';
                tallyLink.className = 'link last';
                tallyLink.textContent = '📊 Tally';
                menu.appendChild(tallyLink);

                const logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.className = 'link';
                logoutLink.style.cssText = 'color:#cc4444; margin-top:auto;';
                logoutLink.textContent = '🚪 Logout';
                logoutLink.onclick = logout;
                menu.appendChild(logoutLink);
            }

            function buildDashboardCards() {
                const container = document.getElementById('positionCards');
                container.innerHTML = '';

                allPositions.forEach(pos => {
                    const card = document.createElement('div');
                    card.className = 'dash-card';

                    const savedVote = localStorage.getItem('vote-' + pos.name + '-name');
                    const statusColor = savedVote ? '#1b9a9a' : '#999';
                    const statusText = savedVote ? 'Voted: ' + savedVote : 'Not yet voted';

                    card.innerHTML = `
                        <div class="icon">${getEmoji(pos.name)}</div>
                        <h2>${pos.name}</h2>
                        <p style="color: ${statusColor}">${statusText}</p>
                        <a href="vote.html?position=${encodeURIComponent(pos.name)}" class="vote-link">Vote Now →</a>
                    `;

                    container.appendChild(card);
                });
            }

            function updateNotice() {
                const notice = document.getElementById('noticeText');
                notice.textContent = 'Make sure to vote in all ' + allPositions.length + ' categories before submitting your ballot.';
            }

            function loadBranding() {
                fetch('../api/get_settings.php')
                    .then(r => r.json())
                    .then(data => {
                        if (!data.success) return;
                        const s = data.data;
                        const nameEl = document.querySelector('.logo h2');
                        const yearEl = document.querySelector('.logo p');
                        if (nameEl) nameEl.textContent = s.org_name       || 'Student Vote';
                        if (yearEl) yearEl.textContent = s.election_title || 'Election 2026';
                    });
            }

            function logout() {
                localStorage.clear();
                window.location.href = '../index.html';
            }
        </script>
    </body>
</html>
